[project]
name = "patchbench"
version = "0.1.0"
description = "Minimal SWE-bench-inspired evaluation harness"
requires-python = ">=3.9"
dependencies = ["pyyaml", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=6.2"]

[project.scripts]
patchbench = "patchbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
