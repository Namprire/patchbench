server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite produces a client-side SPA.  Unknown paths must load the app so
    # React Router can handle direct requests such as /dashboard.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
